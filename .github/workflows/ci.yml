name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Version has a changelog entry
        run: |
          v="$(tr -d '[:space:]' < app/VERSION)"
          echo "app/VERSION is $v"
          grep -Eq "^## \[?v?${v//./\\.}\]?" CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $v"; exit 1; }

      - name: App starts and serves the API
        run: |
          DATA_DIR=/tmp/hls PORT=8090 python -m app.main &
          for i in $(seq 1 20); do curl -sf localhost:8090/api/health && break; sleep 1; done
          sleep 3
          curl -sf localhost:8090/api/overview > /dev/null
          curl -sf "localhost:8090/api/processes?limit=5" > /dev/null
          curl -sf localhost:8090/api/disks > /dev/null
          curl -sf localhost:8090/api/network > /dev/null
          curl -sf "localhost:8090/api/update?check=false" > /dev/null
          for p in api/sensors "api/metrics/system?range=1h" "api/metrics/containers?range=24h" api/traffic api/speedtest api/monitors api/events api/settings api/docker assets/js/core.js assets/app.css; do
            curl -sf "localhost:8090/$p" > /dev/null || { echo "::error::$p failed"; exit 1; }
          done
          curl -sf -X POST localhost:8090/api/monitors -H 'content-type: application/json' -d '{"name":"ci","type":"dns","target":"localhost"}' > /dev/null
          echo "API OK"

      - name: Shell scripts parse
        run: bash -n install.sh && bash -n uninstall.sh && sh -n scripts/docker-entrypoint.sh

      - name: Docker image builds
        run: docker build -t homelabstats:ci .
