# HomeLabStats
# Settings live in .env (copy .env.example to .env first). Do not edit this file
# for configuration: in-app updates replace it with newer versions.
services:
  homelabstats:
    build: .
    image: homelabstats:local
    container_name: homelabstats
    # Brings the app back up after an in-app update restarts it.
    restart: unless-stopped

    # Host networking: real interfaces, pings from the host's point of view and
    # true throughput. The dashboard listens on PORT from .env (default 8090).
    network_mode: host
    # Host PID namespace: lets it list every process on the server.
    pid: host

    env_file:
      - path: .env
        required: false
    environment:
      HOST_ROOT: /host
      DATA_DIR: /data
      INSTALL_METHOD: docker

    volumes:
      # This git checkout. The in-app updater pulls new code into it.
      - ./:/app
      # Read-only view of the host filesystem, used for disk space and host info.
      - /:/host:ro,rslave
      # Docker API access for the container list, stats and logs.
      - /var/run/docker.sock:/var/run/docker.sock
      # Speed test history.
      - ./data:/data
